name: CDRL feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: make setup
        shell: bash
        run: make setup
      - name: make verify
        shell: bash
        run: make verify
      - name: make run
        shell: bash
        run: make run
      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: m01-verify
          path: artifacts/m01-verify.json
