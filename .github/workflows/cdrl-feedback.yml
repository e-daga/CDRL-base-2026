name: CDRL feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        shell: bash
        run: npm ci
      - name: Start PostgreSQL
        shell: bash
        run: docker compose up -d postgres
      - name: Apply migrations and seed
        shell: bash
        run: |
          node scripts/wait-for-postgres.mjs
          node scripts/migrate.mjs
          node scripts/seed.mjs
      - name: Run tests
        shell: bash
        run: npm test
      - name: Write verification artifact
        shell: bash
        run: node scripts/verify.mjs
      - name: Run project
        shell: bash
        run: make run
