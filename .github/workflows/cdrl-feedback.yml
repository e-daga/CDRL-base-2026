name: CDRL feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: make setup
        shell: bash
        run: make setup
      - name: make verify
        shell: bash
        run: |
          set -o pipefail
          make verify 2>&1 | tee artifacts/m03-verify.log
      - name: make run
        shell: bash
        run: make run
      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m03-delivery-${{ github.sha }}
          if-no-files-found: error
          path: |
            artifacts/m01-verify.json
            artifacts/m02-verify.json
            artifacts/m03-verify.json
            artifacts/m03-tests.json
            artifacts/m03-secrets.json
            artifacts/m03-verify.log
            evidence/m03-roles-secrets.json
            evidence/m03-roles-secrets-local.json
